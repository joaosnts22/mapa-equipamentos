<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Login - Mapa da Sala Fria</title>

  <style>
    :root {
      --bg: #07111f;
      --panel: #0d1929;
      --line: #26384e;
      --text: #edf4fb;
      --muted: #8da2ba;
      --cyan: #55dcff;
      --cyan-dark: #0e7490;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;
      background:
        radial-gradient(
          circle at 15% 0,
          #102741 0,
          transparent 34%
        ),
        var(--bg);
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(440px, 100%);
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #0c1828f2;
      box-shadow: 0 28px 70px #0008;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--cyan);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: 31px;
      line-height: 1.15;
    }

    .description {
      margin: 12px 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #b9c9d9;
      font-size: 12px;
      font-weight: 800;
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: #fff;
      background: var(--bg);
      font: inherit;
    }

    .field input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px #55dcff1f;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 86px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 7px;
      transform: translateY(-50%);
      padding: 7px 10px;
      border: 0;
      border-radius: 8px;
      color: var(--cyan);
      background: transparent;
      font-weight: 800;
      cursor: pointer;
    }

    .message {
      display: none;
      margin: 0 0 16px;
      padding: 11px 12px;
      border: 1px solid var(--danger);
      border-radius: 10px;
      color: #fecaca;
      background: #4a1d24;
      font-size: 13px;
      line-height: 1.4;
    }

    .message.visible {
      display: block;
    }

    .message.success {
      border-color: var(--success);
      color: #bbf7d0;
      background: #123c27;
    }

    .submit-button {
      width: 100%;
      min-height: 46px;
      border: 1px solid #22d3ee;
      border-radius: 11px;
      color: #fff;
      background: var(--cyan-dark);
      font-size: 14px;
      font-weight: 850;
      cursor: pointer;
    }

    .submit-button:hover {
      filter: brightness(1.14);
    }

    .submit-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .consult-button {
      display: block;
      width: 100%;
      margin-top: 11px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--text);
      background: #122238;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .consult-button:hover {
      filter: brightness(1.14);
    }

    .security-note {
      margin: 19px 0 0;
      color: #71869c;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    .current-session {
      display: none;
      margin-bottom: 18px;
      padding: 13px;
      border: 1px solid #22c55e66;
      border-radius: 11px;
      color: #bbf7d0;
      background: #123c2766;
      font-size: 13px;
      line-height: 1.5;
    }

    .current-session.visible {
      display: block;
    }
  </style>
  <link rel="stylesheet" href="/mapa-tema.css?v=1">
</head>

<body>
  <main class="page">
    <section class="login-card">
      <div class="eyebrow">
        NOC • ACESSO ADMINISTRATIVO
      </div>

      <h1>Mapa da Sala Fria</h1>

      <p class="description">
        Entre como administrador para editar fileiras e
        equipamentos. O mapa pode ser aberto normalmente
        em modo de consulta sem autenticação.
      </p>

      <div
        id="currentSession"
        class="current-session"
        role="status"
      ></div>

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="usuario">
            USUÁRIO
          </label>

          <input
            id="usuario"
            name="usuario"
            type="text"
            maxlength="150"
            autocomplete="username"
            required
            autofocus
          >
        </div>

        <div class="field">
          <label for="senha">
            SENHA
          </label>

          <div class="password-wrapper">
            <input
              id="senha"
              name="senha"
              type="password"
              maxlength="500"
              autocomplete="current-password"
              required
            >

            <button
              id="togglePassword"
              class="toggle-password"
              type="button"
            >
              Mostrar
            </button>
          </div>
        </div>

        <button
          id="submitButton"
          class="submit-button"
          type="submit"
        >
          Entrar como administrador
        </button>
      </form>

      <a class="consult-button" href="/">
        Abrir em modo de consulta
      </a>
    </section>
  </main>

  <script>
    const loginForm =
      document.getElementById("loginForm");

    const usernameInput =
      document.getElementById("usuario");

    const passwordInput =
      document.getElementById("senha");

    const submitButton =
      document.getElementById("submitButton");

    const messageBox =
      document.getElementById("message");

    const currentSessionBox =
      document.getElementById("currentSession");

    const togglePasswordButton =
      document.getElementById("togglePassword");


    function showMessage(
      message,
      success = false
    ) {
      messageBox.textContent = message;

      messageBox.classList.add(
        "visible"
      );

      messageBox.classList.toggle(
        "success",
        success
      );
    }


    function clearMessage() {
      messageBox.textContent = "";

      messageBox.classList.remove(
        "visible",
        "success"
      );
    }


    function setLoading(active) {
      submitButton.disabled = active;

      submitButton.textContent = active
        ? "Entrando..."
        : "Entrar como administrador";
    }


    togglePasswordButton.addEventListener(
      "click",
      () => {
        const passwordIsVisible =
          passwordInput.type === "text";

        passwordInput.type =
          passwordIsVisible
            ? "password"
            : "text";

        togglePasswordButton.textContent =
          passwordIsVisible
            ? "Mostrar"
            : "Ocultar";
      }
    );


    loginForm.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();
        clearMessage();

        const usuario =
          usernameInput.value.trim();

        const senha =
          passwordInput.value;

        if (!usuario || !senha) {
          showMessage(
            "Preencha o usuário e a senha."
          );

          return;
        }

        setLoading(true);

        try {
          const response = await fetch(
            "/api/auth/login",
            {
              method: "POST",
              credentials: "same-origin",
              headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
              },
              body: JSON.stringify({
                usuario,
                senha
              })
            }
          );

          let responseData = null;

          try {
            responseData =
              await response.json();
          } catch {
            responseData = null;
          }

          if (!response.ok) {
            const detail =
              responseData?.detail;

            throw new Error(
              typeof detail === "string"
                ? detail
                : "Não foi possível realizar o login."
            );
          }

          passwordInput.value = "";

          showMessage(
            "Login realizado. Abrindo o mapa...",
            true
          );

          window.setTimeout(
            () => {
              window.location.replace("/");
            },
            350
          );
        } catch (error) {
          showMessage(
            error.message
            || "Falha ao conectar ao servidor."
          );

          passwordInput.focus();
          passwordInput.select();
        } finally {
          setLoading(false);
        }
      }
    );


    async function checkCurrentSession() {
      try {
        const response = await fetch(
          "/api/auth/me",
          {
            method: "GET",
            credentials: "same-origin",
            headers: {
              "Accept": "application/json"
            },
            cache: "no-store"
          }
        );

        if (!response.ok) {
          return;
        }

        const userData =
          await response.json();

        const displayName =
          userData.nome_exibicao
          || userData.usuario;

        currentSessionBox.textContent =
          "Já existe uma sessão ativa para "
          + displayName
          + " com perfil "
          + userData.perfil
          + ".";

        currentSessionBox.classList.add(
          "visible"
        );
      } catch {
        currentSessionBox.classList.remove(
          "visible"
        );
      }
    }


    checkCurrentSession();
  </script>
<script src="/mapa-tema.js?v=1"></script>
</body>
</html>
